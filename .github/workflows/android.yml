name: oneCR CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: onecr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled

      # Maven Central rate-limits GitHub runner IPs with HTTP 429, which kills
      # cold dependency resolution (the Aliyun mirror was removed from CI in
      # v0.3.2, so there is no fallback). Gradle keeps every artifact already
      # downloaded in its local cache, so a retry continues where the previous
      # attempt stopped. Only dependency-resolution network errors are retried;
      # real test or compilation failures fail fast with an extracted diagnosis.
      - name: Unit tests (network-tolerant retry)
        shell: bash
        run: |
          set -o pipefail
          print_context() {
            echo ""
            echo "=================== FAILURE DIAGNOSIS (auto-extracted) ==================="
            echo "--- Gradle 'What went wrong' ---"
            awk '/^\* What went wrong:/{flag=1} flag{print; n++} n>25{exit}' gradle-unit-tests.log || true
            echo "--- Tasks that FAILED ---"
            grep -E "> Task .* FAILED" gradle-unit-tests.log | head -10 || true
            echo "--- Failing tests ---"
            grep -E "FAILED$" gradle-unit-tests.log | grep -vE "^> Task|^BUILD FAILED" | head -20 || true
            echo "==========================================================================="
          }
          max=5
          attempt=1
          while [ "$attempt" -le "$max" ]; do
            echo "Gradle attempt $attempt of $max: test"
            if ./gradlew test --stacktrace 2>&1 | tee gradle-unit-tests.log; then
              echo "Unit tests passed on attempt $attempt."
              exit 0
            fi
            if grep -qE "Received status code (429|5[0-9][0-9])" gradle-unit-tests.log && grep -q "Could not resolve" gradle-unit-tests.log; then
              echo "::warning::Transient network error while resolving dependencies (Maven Central 429 on GitHub runner IPs). Retrying in 90s..."
              sleep 90
              attempt=$((attempt + 1))
            else
              print_context
              echo "::error::Gradle failed for a non-network reason -- see the diagnosis above and the 'test-diagnostics' artifact."
              exit 1
            fi
          done
          print_context
          echo "::error::Still hitting Maven Central rate limits after $max attempts. Re-run the job later, or re-enable a Maven mirror in settings.gradle.kts."
          exit 1

      - name: Upload test diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            gradle-unit-tests.log
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # CI has no keystore: the release build falls back to debug signing so
      # the artifact stays installable for smoke tests. Release signing for
      # GitHub Releases is done locally with build.bat (or via secrets later).
      - name: Build release APK (debug-signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
