name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # CI has no keystore: the release build falls back to debug signing so
      # the artifact stays installable for smoke tests. Release signing for
      # GitHub Releases is done locally with build.bat (or via secrets later).
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Compute checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
