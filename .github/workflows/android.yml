name: oneCR CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch - saves minutes on every push.
concurrency:
  group: onecr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew is stored without the executable bit (repos pushed from
      # Windows lose it) - restore it before invoking the wrapper.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Disables the dependency graph submission, which can 401 on repos
          # with restricted default token permissions and fail a green build.
          dependency-graph: disable

      # Tests first: fail fast before spending time on packaging.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # CI has no signing keystore: the release APK falls back to debug
      # signing and is uploaded only as an artifact for smoke testing.
      # Real releases are signed locally with build.bat and the keystore.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
