name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # CI has no keystore: the release build falls back to debug signing so
      # the artifact stays installable for smoke tests. Release signing for
      # GitHub Releases is done locally with build.bat (or via secrets later).
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: oneCR-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    name: Publish GitHub release
    needs: build
    # Matches this repo's tag convention (0.1.2, 0.2.0, … — no "v" prefix).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from gradle.properties
        id: version
        run: echo "name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename and checksum
        run: |
          cd app/build/outputs/apk/release
          cp app-release.apk "oneCR-v${{ steps.version.outputs.name }}.apk"
          sha256sum "oneCR-v${{ steps.version.outputs.name }}.apk" > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: oneCR v${{ steps.version.outputs.name }}
          body_path: docs/release-notes/v${{ steps.version.outputs.name }}.md
          files: |
            app/build/outputs/apk/release/oneCR-v${{ steps.version.outputs.name }}.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
